# OpenVPN Server Configuration for FreePBX
# This configuration sets up an OpenVPN server for secure remote access to FreePBX

# Server mode and network settings
port 1194
proto udp
dev tun

# SSL/TLS root certificate (ca), certificate (cert), and private key (key)
ca /etc/openvpn/keys/ca.crt
cert /etc/openvpn/keys/server.crt
key /etc/openvpn/keys/server.key

# Diffie-Hellman parameters
dh /etc/openvpn/keys/dh2048.pem

# Network topology
topology subnet

# Configure server mode and supply a VPN subnet
server 10.8.0.0 255.255.255.0

# Maintain a record of client <-> virtual IP address
ifconfig-pool-persist /var/log/openvpn/ipp.txt

# Push routes to the client to allow it to reach other private subnets
# Adjust this to match your FreePBX local network
push "route 192.168.1.0 255.255.255.0"

# Allow client-to-client communication
client-to-client

# Keep the connection alive
keepalive 10 120

# Enable compression
comp-lzo

# The maximum number of concurrently connected clients
max-clients 100

# Run OpenVPN with reduced privileges
user nobody
group nogroup

# Persist keys and tunnel device across restarts
persist-key
persist-tun

# Output a short status file showing current connections
status /var/log/openvpn/openvpn-status.log

# Log verbosity level (0-9, 3 is recommended for production)
verb 3

# Notify client of restart so it can automatically reconnect
explicit-exit-notify 1
