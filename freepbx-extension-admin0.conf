# FreePBX Extension Configuration for admin0
# This file contains the PJSIP extension settings for the admin0 user
# 
# NOTE: This configuration requires the following templates to be defined in pjsip.conf:
# - basic-endpoint: Basic endpoint template
# - basic-auth: Basic authentication template  
# - basic-aor: Basic AOR (Address of Record) template
# 
# If these templates don't exist, add the pjsip-templates.conf content to your pjsip.conf first

[admin0](basic-endpoint)
type=endpoint
context=from-internal
auth=admin0
aors=admin0

; Caller ID
callerid="Admin" <1000>

; Codec preferences
allow=!all,ulaw,alaw,gsm,g729

; DTMF mode
dtmf_mode=rfc4733

; Advanced settings
direct_media=no
trust_id_outbound=yes
send_pai=yes
transport=transport-udp

; Media encryption (SRTP)
media_encryption=sdes
media_use_received_transport=no

; RTP settings
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

; Call limit
max_contacts=5

[admin0](basic-auth)
type=auth
auth_type=userpass
username=1000
password=admin0Password123!

[admin0](basic-aor)
type=aor
max_contacts=5
qualify_frequency=60
remove_existing=yes
mailboxes=1000@default
