# FreePBX Extension Configuration for admin0
# This file contains the extension settings for the admin0 user

[admin0]
; Extension number
exten => 1000

; Device type (SIP/PJSIP)
type=friend
context=from-internal

; Caller ID
callerid="Admin" <1000>

; Secret/Password for the extension
secret=admin0Password123!

; Host settings
host=dynamic
nat=yes
canreinvite=no

; Codec preferences
allow=ulaw
allow=alaw
allow=gsm
allow=g729

; DTMF mode
dtmfmode=rfc2833

; Qualify settings to check availability
qualify=yes

; Call limit
call-limit=5

; Voicemail settings
mailbox=1000@default

; Advanced settings
directmedia=no
transport=udp,tcp
encryption=yes
avpf=yes

; Media encryption (SRTP)
media_encryption=sdes

; Allow subscribe for BLF/presence
subscribecontext=from-internal
