# PJSIP Templates for FreePBX Extensions
# Add this to your /etc/asterisk/pjsip.conf before the admin0 extension configuration
# These templates provide common settings that can be inherited by extensions

; Basic endpoint template
[basic-endpoint](!)
type=endpoint
message_context=textmessages
allow_subscribe=yes
subscribe_context=subscriptions
trust_id_inbound=yes
device_state_busy_at=1
moh_suggest=default
100rel=yes
timers=yes

; Basic authentication template
[basic-auth](!)
type=auth
auth_type=userpass

; Basic AOR (Address of Record) template
[basic-aor](!)
type=aor
qualify_timeout=3.0
authenticate_qualify=no
max_contacts=1
remove_existing=yes
remove_unavailable=yes

; UDP transport (usually already defined in default FreePBX installations)
; Uncomment if not present
;[transport-udp]
;type=transport
;protocol=udp
;bind=0.0.0.0:5060
;tos=af42
;cos=3
